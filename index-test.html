<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShotsGame 测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #0F0F23;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    .menu {
      text-align: center;
    }
    h1 {
      color: #7C3AED;
      font-size: 4rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #7C3AED, 0 0 20px #7C3AED;
    }
    p {
      color: #E2E8F0;
      font-size: 1.2rem;
      margin-bottom: 3rem;
    }
    button {
      padding: 1rem 2rem;
      background: transparent;
      border: 2px solid #7C3AED;
      color: #E2E8F0;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #7C3AED;
      box-shadow: 0 0 20px #7C3AED;
    }
  </style>
</head>
<body>
  <div class="menu">
    <h1>SHOTSGAME</h1>
    <p>1v1 在线射击对战</p>
    <button onclick="alert('服务器连接正常！')">寻找对战</button>
  </div>

  <script>
    console.log('✅ HTML 加载成功');
    console.log('✅ CSS 样式正常');
    console.log('✅ JavaScript 运行正常');

    // 测试 Socket.io 连接
    fetch('http://localhost:3000')
      .then(() => console.log('✅ Socket.io 服务器连接成功'))
      .catch(err => console.error('❌ Socket.io 服务器连接失败:', err));
  </script>
</body>
</html>
