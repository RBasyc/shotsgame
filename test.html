<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShotsGame - 简单测试</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@vue/runtime-dom@3/dist/runtime-dom.esm-browser.js"></script>
</head>
<body>
  <div id="app">
    <h1 style="color: #7C3AED; font-size: 4rem; text-align: center; padding-top: 20vh;">
      {{ message }}
    </h1>
    <p style="color: #E2E8F0; text-align: center; font-size: 1.5rem;">
      如果你能看到这段文字，说明浏览器支持 Vue
    </p>
    <button
      onclick="alert('JavaScript 工作正常！')"
      style="
        display: block;
        margin: 2rem auto;
        padding: 1rem 2rem;
        background: #7C3AED;
        border: none;
        color: white;
        font-size: 1.2rem;
        cursor: pointer;
        border-radius: 8px;
      "
    >
      点击测试
    </button>
  </div>

  <script>
    // 最简单的 JavaScript 测试
    const app = document.getElementById('app');
    app.innerHTML = `
      <h1 style="color: #7C3AED; font-size: 4rem; text-align: center; padding-top: 20vh;">
        ShotsGame 工作正常！
      </h1>
      <p style="color: #E2E8F0; text-align: center; font-size: 1.5rem;">
        JavaScript、CSS 和 HTML 都正常运行
      </p>
      <button
        onclick="alert('✅ 所有功能正常！')"
        style="
          display: block;
          margin: 2rem auto;
          padding: 1rem 2rem;
          background: #7C3AED;
          border: none;
          color: white;
          font-size: 1.2rem;
          cursor: pointer;
          border-radius: 8px;
        "
      >
        点击测试按钮
      </button>
    `;

    console.log('✅ HTML 加载成功');
    console.log('✅ JavaScript 执行成功');
    console.log('✅ CSS 样式应用成功');
  </script>
</body>
</html>
